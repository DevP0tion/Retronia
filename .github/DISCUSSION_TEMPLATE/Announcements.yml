body:
- attributes:
    value: 📢 팀에 전할 공지를 아래 항목에 따라 작성해 주세요.
  type: markdown
- attributes:
    description: 공지의 핵심 주제를 간단히 입력해 주세요.
    label: 공지 제목
    placeholder: '예: v0.1.2 패치 노트 / 회의 일정 안내'
  id: title
  type: input
  validations:
    required: true
- attributes:
    description: 팀에게 전달할 내용을 자세히 작성해 주세요.
    label: 공지 내용
    placeholder: '예: 금일 오전 10시 회의에서 다룬 주요 이슈 정리...'
  id: content
  type: textarea
  validations:
    required: true
- attributes:
    description: 공지의 성격을 선택해 주세요.
    label: 공지 유형
    options:
    - 일정 안내
    - 업데이트/패치 소식
    - 중요 결정 공유
    - 기타
  id: notice_type
  type: dropdown
  validations:
    required: true
- attributes:
    label: 확인용 체크박스
    options:
    - label: 위 내용이 사실이며 팀원에게 공유하기에 적절함을 확인했습니다.
      required: true
  type: checkboxes
- attributes:
    value: ✅ 공지가 등록되었습니다. 팀원들이 빠르게 확인할 수 있도록 Discussions 또는 채널에 공유해주세요!
  type: markdown
labels:
- Announcements
title: '[공지사항]'
